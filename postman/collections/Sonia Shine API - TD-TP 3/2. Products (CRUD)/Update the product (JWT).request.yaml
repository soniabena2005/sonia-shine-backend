$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "price": 500,
      "stock": 8
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('Price was updated', () => pm.expect(pm.response.json().data.price).to.eql(500));
    language: text/javascript
order: 4000

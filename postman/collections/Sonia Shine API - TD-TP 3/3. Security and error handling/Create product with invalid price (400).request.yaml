$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Pearl Drop Earrings",
      "description": "Gold-colored stainless steel earrings with a small pearl.",
      "price": -10,
      "category": "Earrings",
      "imageUrl": "/products/clover-earrings.jpg",
      "stock": 12
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000

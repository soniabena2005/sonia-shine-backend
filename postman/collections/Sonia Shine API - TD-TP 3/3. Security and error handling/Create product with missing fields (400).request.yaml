$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Only a name"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Errors are listed', () => pm.expect(pm.response.json().errors).to.be.an('array'));
    language: text/javascript
order: 5000

$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "name": "Test Student", "email": "{{testEmail}}", "password": "{{testPassword}}" }'
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.variables.set('uniqueEmail', `test_${Date.now()}@example.com`);
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is 201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
